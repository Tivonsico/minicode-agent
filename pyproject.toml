[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "minicode-agent"
version = "0.1.0"
description = "A local web coding agent with a modular runtime"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28,<1",
    "python-dotenv>=1.0,<2",
    "jsonschema>=4.23,<5",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "psutil>=6,<8",
    "pymysql[rsa]>=1.1,<2",
    "greenback>=1.3,<2",
]

[project.scripts]
minicode = "app.main:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.9,<1"]

[tool.setuptools.data-files]
"share/minicode/frontend" = ["frontend/*.html", "frontend/*.css", "frontend/*.js", "frontend/*.svg"]
"share/minicode/frontend/inspection" = ["frontend/inspection/*.js", "frontend/inspection/*.css"]
"share/minicode/frontend/evaluation" = ["frontend/evaluation/*.js"]

[tool.setuptools.packages.find]
include = ["backend*", "app*"]

[tool.setuptools.package-data]
"backend.evaluation" = ["data/*.json", "data/*.txt"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["others/test"]
pythonpath = ["others"]
addopts = "--basetemp=others/test_record/runtime"
cache_dir = "others/test_record/.pytest_cache"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
