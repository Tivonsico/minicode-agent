[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "minicode-agent"
version = "0.1.0"
description = "A project-local terminal coding agent"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<1", "python-dotenv>=1.0,<2", "jsonschema>=4.23,<5", "prompt-toolkit>=3.0.48,<4"]

[project.scripts]
minicode = "app.main:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.9,<1"]

[tool.setuptools]
py-modules = ["config"]

[tool.setuptools.packages.find]
include = ["conversation*", "agent*", "tools*", "memory*", "context*", "app*", "skill*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["others/test"]
pythonpath = ["others"]
addopts = "--basetemp=others/test_record/runtime"
cache_dir = "others/test_record/.pytest_cache"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
